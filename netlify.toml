# Sin CMS_URL/CMS_TOKEN el sitio se construye desde src/data
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.22.3"

# Archivos con hash en el nombre (JS, CSS y fuentes): caché de un año
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
